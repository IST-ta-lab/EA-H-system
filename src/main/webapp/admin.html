<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUPT TA Hiring System - Admin</title>
    <link rel="stylesheet" href="./admin.css?v=3" />
</head>
<body>
<div class="admin-shell">
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="container nav-inner">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 6.5 12 3l8 3.5-8 3.5L4 6.5Zm2 3.1V15c0 1.2 2.7 3 6 3s6-1.8 6-3V9.6"
                              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand-name">BUPT TA Hiring System - Admin</span>
            </div>

            <div class="nav-right">
                <button class="nav-icon-btn" id="openRequestsBtn" type="button" aria-label="Open role change requests">
                    <span class="nav-dot hidden" id="requestDot"></span>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0a3 3 0 0 1-6 0"
                              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <span class="nav-username" id="navUserName">Admin User</span>

                <button class="nav-icon-btn" id="logoutBtn" type="button" aria-label="Logout">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m-5 5H9"
                              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <div class="avatar-btn" id="adminAvatar" aria-label="Admin avatar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container page-main">
        <!-- 顶部两张动作卡 -->
        <section class="hero-actions" id="heroActions">
            <!-- JS 渲染：Statistics Report / System Users -->
        </section>

        <!-- 主监控面板 -->
        <section class="monitor-shell glass-card">
            <div class="monitor-switcher" id="monitorSwitcher">
                <!-- JS 渲染：TA / MO / Logs -->
            </div>

            <div class="monitor-content" id="monitorContent">
                <!-- JS 渲染：TA workload / MO workload / Logs -->
            </div>
        </section>
    </main>
</div>

<!-- ========================= -->
<!-- TA 详情弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="taDetailModalOverlay">
    <div class="modal-card modal-lg scale-enter" style="max-height:85vh;">
        <div class="modal-header">
            <h2>Teaching Assistant Details</h2>
            <button class="icon-btn" id="closeTaDetailModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body scrollable" id="taDetailModalBody" style="max-height:calc(85vh - 70px);overflow-y:auto;"></div>
    </div>
</div>

<!-- ========================= -->
<!-- 统计报告弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="statsModalOverlay">
    <div class="modal-card modal-xl scale-enter">
        <div class="modal-header">
            <h2>System Statistics Report</h2>
            <button class="icon-btn" id="closeStatsModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body scrollable" id="statsModalBody"></div>
    </div>
</div>

<!-- ========================= -->
<!-- 系统用户弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="usersModalOverlay">
    <div class="modal-card modal-xl scale-enter">
        <div class="modal-header">
            <h2>System Users Management</h2>
            <button class="icon-btn" id="closeUsersModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body scrollable" id="usersModalBody"></div>
    </div>
</div>

<!-- ========================= -->
<!-- 用户详情弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="userDetailModalOverlay">
    <div class="modal-card modal-md scale-enter user-detail-modal-card">
        <div class="user-detail-cover">
            <button class="icon-btn icon-btn-light" id="closeUserDetailModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="user-detail-content" id="userDetailModalBody"></div>
    </div>
</div>

<!-- ========================= -->
<!-- ========================= -->
<!-- Role Change Requests Modal -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="requestsModalOverlay">
    <div class="modal-card modal-lg scale-enter">
        <div class="modal-header">
            <h2>Role Change Requests</h2>
            <button class="icon-btn" id="closeRequestsModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body scrollable" id="requestsModalBody"></div>
    </div>
</div>

<!-- ========================= -->
<!-- 所有岗位管理弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="allJobsModalOverlay">
    <div class="modal-card modal-xl scale-enter">
        <div class="modal-header">
            <h2>All Jobs Management</h2>
            <button class="icon-btn" id="closeAllJobsModalBtn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body scrollable" id="allJobsModalBody"></div>
    </div>
</div>

<!-- ========================= -->
<!-- 岗位详情弹窗 -->
<!-- ========================= -->
<div class="modal-overlay hidden" id="jobDetailModalOverlay">
    <div class="modal-card modal-lg scale-enter">
        <div class="modal-header">
            <h2>Job Details</h2>
            <button class="icon-btn" id="closeJobDetailModalBtn" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"
                          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="modal-body" id="jobDetailModalBody"></div>
    </div>
</div>

<script src="./admin.js?v=3"></script>

<div class="inland-security-footer">
    <div class="tooltip-container">
        <div class="trigger-content">
            <span class="minimax-link" style="text-decoration:none;">© 2026 EA-H-system</span>
        </div>
    </div>
</div>

</body>
</html>
