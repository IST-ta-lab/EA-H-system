<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MO 工作台 - TA Market</title>

  <!-- 纯前端方式引入样式，不依赖 npm -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-sans: Inter, system-ui, -apple-system, sans-serif;
      --font-display: Outfit, Inter, system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background-color: #f8fafc;
      background-image:
        radial-gradient(circle at 0% 0%, rgba(224, 231, 255, 0.62) 0%, transparent 40%),
        radial-gradient(circle at 100% 45%, rgba(252, 231, 243, 0.52) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(219, 234, 254, 0.45) 0%, transparent 40%);
      background-attachment: fixed;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display {
      font-family: var(--font-display);
    }

    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .chip-active {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.34);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 70;
      padding: 16px;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal-card {
      width: min(100%, 920px);
      max-height: 88vh;
      overflow: auto;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.9), transparent);
      -webkit-mask-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.9), transparent);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.2);
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-indigo-500/25 selection:text-indigo-950">
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="dot-grid"></div>
    <div class="absolute top-[-12%] left-[-8%] w-[44%] h-[42%] rounded-full bg-indigo-200/55 blur-[110px]"></div>
    <div class="absolute bottom-[-12%] right-[-10%] w-[45%] h-[42%] rounded-full bg-rose-200/45 blur-[120px]"></div>
    <div class="absolute top-[26%] right-[18%] w-[24%] h-[24%] rounded-full bg-sky-200/40 blur-[95px]"></div>
  </div>

  <nav class="glass sticky top-0 z-40 border-b border-slate-200/60">
    <div class="max-w-7xl mx-auto h-20 px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 shadow-[0_10px_24px_rgba(79,70,229,0.35)] flex items-center justify-center text-white font-bold rotate-3">M</div>
        <div>
          <div class="font-display text-2xl font-bold tracking-tight">TA Market</div>
          <div class="text-xs text-slate-500">MO Console</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="navUser" class="text-sm text-slate-600"></div>
        <button id="btnRefresh" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm">刷新岗位</button>
        <button id="btnLogout" class="px-3 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-sm">退出登录</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-10 flex flex-col lg:flex-row gap-10">
    <section class="flex-1 min-w-0">
      <div class="mb-8">
        <h1 class="font-display text-5xl md:text-6xl font-bold tracking-tight text-slate-900">Discover Roles<span class="text-indigo-600">.</span></h1>
        <p class="text-slate-500 text-lg mt-3">已发布岗位查询、详情查看、申请审核全部从后端实时拉取。</p>
      </div>

      <div class="flex gap-3 mb-5">
        <div class="relative flex-1">
          <input id="searchInput" type="text" placeholder="按岗位名称/模块搜索..." class="w-full pl-4 pr-4 py-3.5 rounded-2xl border border-slate-200/80 bg-white/80 text-slate-800 placeholder:text-slate-400 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10" />
        </div>
        <button class="w-14 h-14 rounded-2xl border border-slate-200/80 bg-white/80 text-slate-500" title="筛选按钮（未接后端）">筛</button>
      </div>

      <div id="tagBar" class="flex flex-wrap gap-2.5 mb-8"></div>

      <div id="jobList" class="space-y-4"></div>

      <div id="emptyHint" class="hidden text-center py-16 text-slate-400">
        <div class="text-3xl mb-2">📭</div>
        <div>没有匹配的岗位。</div>
      </div>
    </section>

    <aside class="w-full lg:w-[340px] shrink-0 flex flex-col gap-5 lg:sticky lg:top-28 self-start">
      <div class="glass rounded-3xl p-7 shadow-[0_12px_28px_rgba(15,23,42,0.06)]">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-display font-bold text-xl text-slate-900">My Profile</h2>
          <button id="btnEditProfile" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600">编辑</button>
        </div>
        <div class="space-y-2 text-sm">
          <div><span class="text-slate-400">姓名：</span><span id="profileName" class="font-medium"></span></div>
          <div><span class="text-slate-400">用户名：</span><span id="profileUsername" class="font-medium"></span></div>
          <div><span class="text-slate-400">邮箱：</span><span id="profileEmail" class="font-medium"></span></div>
          <div><span class="text-slate-400">课程：</span><span id="profileCourse" class="font-medium"></span></div>
        </div>
        <p class="text-xs text-slate-400 mt-4">注：资料编辑接口在示例中未提供，当前仅展示。</p>
      </div>

      <div class="glass rounded-3xl p-7 shadow-[0_12px_28px_rgba(15,23,42,0.06)]">
        <h3 class="font-display font-bold text-xl mb-4">Operations</h3>
        <button id="btnOpenPublish" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">发布新岗位</button>
        <button id="btnOpenAudit" class="w-full mt-3 py-3.5 rounded-2xl bg-white border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition">审核岗位申请</button>

        <div class="mt-5 p-4 rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-900 text-sm">
          <div class="font-semibold">当前统计</div>
          <div class="mt-2">我的岗位：<span id="countJobs" class="mono font-semibold">0</span></div>
          <div>待审核申请：<span id="countPending" class="mono font-semibold">0</span></div>
        </div>
      </div>

      <div class="glass rounded-3xl p-7 shadow-[0_12px_28px_rgba(15,23,42,0.06)]">
        <h3 class="font-display font-bold text-xl mb-3">Debug Response</h3>
        <pre id="debugResponse" class="mono text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-2xl p-3 overflow-auto max-h-48">等待请求...</pre>
      </div>
    </aside>
  </main>

  <div id="publishModal" class="modal-mask" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-display text-2xl font-bold">发布岗位</h2>
        <button data-close="publishModal" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600">✕</button>
      </div>

      <div class="p-8 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">岗位名称</label>
          <input id="jobName" type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" placeholder="如：CS101 助教" />
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">岗位类型</label>
            <select id="jobType" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none">
              <option value="1">助教</option>
              <option value="2">助理</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">所属模块</label>
            <input id="belongModule" type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" placeholder="如：软件工程" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">岗位描述</label>
          <textarea id="jobDesc" rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" placeholder="请输入岗位职责和要求"></textarea>
        </div>
        <div class="grid sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">每周工时</label>
            <input id="workHoursWeekly" type="number" min="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">招聘人数</label>
            <input id="recruitNum" type="number" min="1" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">截止日期</label>
            <input id="applyDeadline" type="date" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none" />
          </div>
        </div>
      </div>

      <div class="px-8 py-5 border-t border-slate-100 bg-slate-50/60 flex justify-end gap-3">
        <button data-close="publishModal" class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600">取消</button>
        <button id="btnSubmitPublish" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white">确认发布</button>
      </div>
    </div>
  </div>

  <div id="jobDetailModal" class="modal-mask" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
        <h2 id="detailTitle" class="font-display text-2xl font-bold">岗位详情</h2>
        <button data-close="jobDetailModal" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600">✕</button>
      </div>
      <div id="detailBody" class="p-8 text-sm text-slate-700"></div>
    </div>
  </div>

  <div id="auditModal" class="modal-mask" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-display text-2xl font-bold">岗位申请审核</h2>
        <button data-close="auditModal" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600">✕</button>
      </div>

      <div class="px-8 pt-6 pb-3 border-b border-slate-100">
        <div class="flex flex-col sm:flex-row gap-3">
          <select id="auditJobSelector" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 bg-white"></select>
          <button id="btnLoadApplicants" class="px-5 py-3 rounded-xl bg-slate-900 text-white">查询申请人</button>
        </div>
      </div>

      <div id="auditList" class="p-8 space-y-3"></div>
    </div>
  </div>

  <script>
    const BASE_URL = '/tapj';

    const state = {
      currentUser: null,
      jobs: [],
      filteredJobs: [],
      activeTags: [],
      pendingMap: {},
      selectedJobIdForAudit: ''
    };

    const dom = {
      navUser: document.getElementById('navUser'),
      btnLogout: document.getElementById('btnLogout'),
      btnRefresh: document.getElementById('btnRefresh'),
      btnOpenPublish: document.getElementById('btnOpenPublish'),
      btnOpenAudit: document.getElementById('btnOpenAudit'),
      btnEditProfile: document.getElementById('btnEditProfile'),
      btnSubmitPublish: document.getElementById('btnSubmitPublish'),
      searchInput: document.getElementById('searchInput'),
      tagBar: document.getElementById('tagBar'),
      jobList: document.getElementById('jobList'),
      emptyHint: document.getElementById('emptyHint'),
      debugResponse: document.getElementById('debugResponse'),
      profileName: document.getElementById('profileName'),
      profileUsername: document.getElementById('profileUsername'),
      profileEmail: document.getElementById('profileEmail'),
      profileCourse: document.getElementById('profileCourse'),
      countJobs: document.getElementById('countJobs'),
      countPending: document.getElementById('countPending'),
      publishModal: document.getElementById('publishModal'),
      jobDetailModal: document.getElementById('jobDetailModal'),
      detailTitle: document.getElementById('detailTitle'),
      detailBody: document.getElementById('detailBody'),
      auditModal: document.getElementById('auditModal'),
      auditJobSelector: document.getElementById('auditJobSelector'),
      btnLoadApplicants: document.getElementById('btnLoadApplicants'),
      auditList: document.getElementById('auditList')
    };

    function escapeHtml(v) {
      if (v === null || v === undefined) return '';
      return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setDebug(data) {
      dom.debugResponse.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    async function request(url, options = {}) {
      try {
        const res = await fetch(BASE_URL + url, {
          credentials: 'include',
          ...options
        });
        const text = await res.text();
        try {
          return { ok: true, data: JSON.parse(text) };
        } catch (e) {
          return { ok: false, raw: text };
        }
      } catch (e) {
        return { ok: false, error: e.message };
      }
    }

    // 已实现后端接口连接
    // 接口: GET /user?action=getLoginUser
    async function loadLoginUser() {
      const r = await request('/user?action=getLoginUser');
      setDebug(r.data || r.raw || r.error);
      if (!(r.ok && r.data && r.data.code === 200)) {
        alert('未登录或登录已过期，请重新登录');
        window.location.href = 'index.html';
        return false;
      }

      state.currentUser = r.data.data;
      if (state.currentUser.userType !== 2 && state.currentUser.userType !== 3) {
        alert('仅 MO/Admin 可访问此页面');
        window.location.href = 'main.html';
        return false;
      }

      dom.navUser.textContent = '当前用户：' + (state.currentUser.realName || state.currentUser.username || 'MO');
      dom.profileName.textContent = state.currentUser.realName || '-';
      dom.profileUsername.textContent = state.currentUser.username || '-';
      dom.profileEmail.textContent = state.currentUser.email || '-';
      dom.profileCourse.textContent = state.currentUser.course || '-';
      return true;
    }

    // 已实现后端接口连接
    // 接口: POST /user?action=logout
    async function logout() {
      await request('/user?action=logout', { method: 'POST' });
      alert('已退出登录');
      window.location.href = 'index.html';
    }

    function normalizeJob(job) {
      const tags = [];
      if (job.belongModule) tags.push(job.belongModule);
      tags.push(job.jobType === 1 ? '助教' : '助理');
      return {
        raw: job,
        jobId: job.jobId,
        jobName: job.jobName,
        jobType: job.jobType,
        belongModule: job.belongModule,
        jobDesc: job.jobDesc,
        workHoursWeekly: job.workHoursWeekly,
        recruitNum: job.recruitNum,
        hiredNum: job.hiredNum,
        applyDeadline: job.applyDeadline,
        jobStatus: job.jobStatus,
        tags
      };
    }

    // 已实现后端接口连接
    // 接口: GET /job?action=listMy
    async function loadMyJobs() {
      const r = await request('/job?action=listMy');
      setDebug(r.data || r.raw || r.error);
      if (r.ok && r.data && r.data.code === 200) {
        state.jobs = (r.data.data || []).map(normalizeJob);
      } else {
        state.jobs = [];
      }

      applyFilter();
      renderTagBar();
      renderJobList();
      renderAuditSelector();
      await preloadPendingCount();
    }

    function currentKeyword() {
      return dom.searchInput.value.trim().toLowerCase();
    }

    function applyFilter() {
      const keyword = currentKeyword();
      state.filteredJobs = state.jobs.filter((job) => {
        const byKeyword = !keyword
          || (job.jobName || '').toLowerCase().includes(keyword)
          || (job.belongModule || '').toLowerCase().includes(keyword)
          || (job.jobDesc || '').toLowerCase().includes(keyword);

        const byTags = state.activeTags.length === 0
          || state.activeTags.every((tag) => job.tags.includes(tag));

        return byKeyword && byTags;
      });
    }

    function allTags() {
      const set = new Set();
      state.jobs.forEach((j) => j.tags.forEach((t) => set.add(t)));
      return Array.from(set);
    }

    function toggleTag(tag) {
      if (state.activeTags.includes(tag)) {
        state.activeTags = state.activeTags.filter((x) => x !== tag);
      } else {
        state.activeTags.push(tag);
      }
      applyFilter();
      renderTagBar();
      renderJobList();
    }

    function renderTagBar() {
      const tags = allTags();
      if (tags.length === 0) {
        dom.tagBar.innerHTML = '<span class="text-sm text-slate-400">暂无可用标签</span>';
        return;
      }

      dom.tagBar.innerHTML = tags.map((tag) => {
        const active = state.activeTags.includes(tag);
        return '<button class="px-4 py-2 rounded-xl text-sm border transition ' + (active ? 'chip-active' : 'bg-white/70 text-slate-600 border-slate-200 hover:bg-white') + '" data-tag="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</button>';
      }).join('');

      dom.tagBar.querySelectorAll('button[data-tag]').forEach((btn) => {
        btn.addEventListener('click', () => toggleTag(btn.getAttribute('data-tag')));
      });
    }

    function statusText(status) {
      if (status === 0) return '<span class="text-emerald-700">招聘中</span>';
      if (status === 1) return '<span class="text-amber-700">已截止</span>';
      if (status === 2) return '<span class="text-rose-700">已招满</span>';
      if (status === 3) return '<span class="text-slate-500">已关闭</span>';
      return '<span class="text-slate-400">未知</span>';
    }

    function renderJobList() {
      if (state.filteredJobs.length === 0) {
        dom.jobList.innerHTML = '';
        dom.emptyHint.classList.remove('hidden');
        dom.countJobs.textContent = String(state.jobs.length);
        return;
      }

      dom.emptyHint.classList.add('hidden');
      dom.jobList.innerHTML = state.filteredJobs.map((job) => {
        const pending = state.pendingMap[job.jobId] || 0;
        return (
          '<article class="glass rounded-3xl p-6 md:p-7 shadow-[0_10px_26px_rgba(15,23,42,0.06)] border border-white/90">'
          + '<div class="flex flex-col sm:flex-row sm:items-start gap-5 justify-between">'
          + '<div class="min-w-0">'
          + '<h3 class="font-display text-2xl font-bold text-slate-900 truncate">' + escapeHtml(job.jobName) + '</h3>'
          + '<div class="mt-2 text-sm text-slate-500">ID: <span class="mono">' + escapeHtml(job.jobId) + '</span> | 模块: ' + escapeHtml(job.belongModule || '-') + '</div>'
          + '<div class="mt-1 text-sm text-slate-500">工时: ' + escapeHtml(job.workHoursWeekly) + 'h/周 | 招聘: ' + escapeHtml(job.recruitNum) + ' | 已招: ' + escapeHtml(job.hiredNum || 0) + ' | 截止: ' + escapeHtml(job.applyDeadline || '-') + '</div>'
          + '<div class="mt-1 text-sm">状态: ' + statusText(job.jobStatus) + '</div>'
          + '<p class="mt-4 text-slate-700 line-clamp-2">' + escapeHtml(job.jobDesc || '') + '</p>'
          + '<div class="mt-4 flex flex-wrap gap-2">' + job.tags.map((t) => '<span class="px-2.5 py-1 rounded-lg text-xs border border-slate-200 bg-white text-slate-600">' + escapeHtml(t) + '</span>').join('') + '</div>'
          + '</div>'
          + '<div class="flex flex-row sm:flex-col gap-2 sm:w-[170px] shrink-0">'
          + '<button class="btn-detail px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50" data-jobid="' + escapeHtml(job.jobId) + '">查看详情</button>'
          + '<button class="btn-audit px-4 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700" data-jobid="' + escapeHtml(job.jobId) + '">审核申请 (' + pending + ')</button>'
          + '</div>'
          + '</div>'
          + '</article>'
        );
      }).join('');

      dom.countJobs.textContent = String(state.jobs.length);

      dom.jobList.querySelectorAll('.btn-detail').forEach((btn) => {
        btn.addEventListener('click', () => openJobDetail(btn.getAttribute('data-jobid')));
      });

      dom.jobList.querySelectorAll('.btn-audit').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.selectedJobIdForAudit = btn.getAttribute('data-jobid');
          dom.auditJobSelector.value = state.selectedJobIdForAudit;
          showModal(dom.auditModal);
          await loadApplicants(state.selectedJobIdForAudit);
        });
      });
    }

    function showModal(el) {
      el.classList.add('show');
    }

    function closeModal(el) {
      el.classList.remove('show');
    }

    function bindCloseModal() {
      document.querySelectorAll('[data-close]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-close');
          const modal = document.getElementById(target);
          if (modal) closeModal(modal);
        });
      });

      [dom.publishModal, dom.jobDetailModal, dom.auditModal].forEach((m) => {
        m.addEventListener('click', (e) => {
          if (e.target === m) closeModal(m);
        });
      });
    }

    // 已实现后端接口连接
    // 接口: POST /job?action=publish
    async function publishJob() {
      const params = new URLSearchParams();
      params.append('jobName', document.getElementById('jobName').value.trim());
      params.append('jobType', document.getElementById('jobType').value);
      params.append('belongModule', document.getElementById('belongModule').value.trim());
      params.append('jobDesc', document.getElementById('jobDesc').value.trim());
      params.append('workHoursWeekly', document.getElementById('workHoursWeekly').value.trim());
      params.append('recruitNum', document.getElementById('recruitNum').value.trim());
      params.append('applyDeadline', document.getElementById('applyDeadline').value.trim());

      const r = await request('/job?action=publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
      setDebug(r.data || r.raw || r.error);

      if (r.ok && r.data) {
        alert(r.data.msg || '提交完成');
      } else {
        alert('发布失败');
      }

      if (r.ok && r.data && r.data.code === 200) {
        closeModal(dom.publishModal);
        document.getElementById('jobName').value = '';
        document.getElementById('belongModule').value = '';
        document.getElementById('jobDesc').value = '';
        document.getElementById('workHoursWeekly').value = '';
        document.getElementById('recruitNum').value = '';
        document.getElementById('applyDeadline').value = '';
        await loadMyJobs();
      }
    }

    // 已实现后端接口连接
    // 接口: GET /job?action=getDetail&jobId=...
    async function openJobDetail(jobId) {
      const r = await request('/job?action=getDetail&jobId=' + encodeURIComponent(jobId));
      setDebug(r.data || r.raw || r.error);

      if (!(r.ok && r.data && r.data.code === 200)) {
        alert('获取岗位详情失败');
        return;
      }

      const job = r.data.data;
      dom.detailTitle.textContent = job.jobName || '岗位详情';
      dom.detailBody.innerHTML = ''
        + '<div class="grid sm:grid-cols-2 gap-x-10 gap-y-3 text-sm">'
        + '<div><span class="text-slate-400">岗位ID：</span><span class="mono">' + escapeHtml(job.jobId) + '</span></div>'
        + '<div><span class="text-slate-400">岗位类型：</span>' + escapeHtml(job.jobType === 1 ? '助教' : '助理') + '</div>'
        + '<div><span class="text-slate-400">所属模块：</span>' + escapeHtml(job.belongModule || '-') + '</div>'
        + '<div><span class="text-slate-400">每周工时：</span>' + escapeHtml(job.workHoursWeekly) + ' 小时</div>'
        + '<div><span class="text-slate-400">招聘人数：</span>' + escapeHtml(job.recruitNum) + '</div>'
        + '<div><span class="text-slate-400">已招人数：</span>' + escapeHtml(job.hiredNum || 0) + '</div>'
        + '<div><span class="text-slate-400">截止日期：</span>' + escapeHtml(job.applyDeadline || '-') + '</div>'
        + '<div><span class="text-slate-400">岗位状态：</span>' + statusText(job.jobStatus) + '</div>'
        + '</div>'
        + '<hr class="my-5 border-slate-100" />'
        + '<div>'
        + '<div class="text-slate-400 mb-2">岗位描述</div>'
        + '<div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 leading-relaxed">' + escapeHtml(job.jobDesc || '') + '</div>'
        + '</div>';

      showModal(dom.jobDetailModal);
    }

    function renderAuditSelector() {
      if (state.jobs.length === 0) {
        dom.auditJobSelector.innerHTML = '<option value="">暂无岗位</option>';
        return;
      }

      dom.auditJobSelector.innerHTML = state.jobs.map((job) => {
        return '<option value="' + escapeHtml(job.jobId) + '">' + escapeHtml(job.jobName) + ' (ID:' + escapeHtml(job.jobId) + ')</option>';
      }).join('');

      if (!state.selectedJobIdForAudit) {
        state.selectedJobIdForAudit = state.jobs[0].jobId;
      }
      dom.auditJobSelector.value = state.selectedJobIdForAudit;
    }

    function appStatusText(status) {
      if (status === 0 || status === '0') return '待审核';
      if (status === 1 || status === '1') return '通过';
      if (status === 2 || status === '2') return '拒绝';
      return '未知';
    }

    function getApplyStatus(app) {
      if (app && app.status !== undefined && app.status !== null) return app.status;
      if (app && app.applyStatus !== undefined && app.applyStatus !== null) return app.applyStatus;
      return null;
    }

    // 已实现后端接口连接
    // 接口: GET /application?action=listByJob&jobId=...
    async function loadApplicants(jobId) {
      const r = await request('/application?action=listByJob&jobId=' + encodeURIComponent(jobId));
      setDebug(r.data || r.raw || r.error);

      if (!(r.ok && r.data && r.data.code === 200)) {
        dom.auditList.innerHTML = '<div class="text-slate-400">获取申请列表失败</div>';
        return;
      }

      const allApps = r.data.data || [];
      const pendingApps = allApps.filter((app) => getApplyStatus(app) == 0);
      state.pendingMap[jobId] = pendingApps.length;

      if (pendingApps.length === 0) {
        dom.auditList.innerHTML = '<div class="text-center text-slate-400 py-8">暂无待审核申请</div>';
        recalcPendingCount();
        renderJobList();
        return;
      }

      dom.auditList.innerHTML = pendingApps.map((app) => {
        return ''
          + '<div class="border border-slate-200 rounded-2xl p-4 bg-white" id="app-' + escapeHtml(app.applicationId) + '">'
          + '<div class="flex flex-wrap items-center justify-between gap-3">'
          + '<div>'
          + '<div class="font-semibold text-slate-900">申请ID: ' + escapeHtml(app.applicationId) + '</div>'
          + '<div class="text-sm text-slate-500 mt-1">TA ID: ' + escapeHtml(app.taId || app.taUserId || '-') + ' | 姓名: ' + escapeHtml(app.taRealName || '无') + '</div>'
          + '<div class="text-xs text-slate-400 mt-1">状态: ' + appStatusText(getApplyStatus(app)) + '</div>'
          + '</div>'
          + '<div class="flex gap-2">'
          + '<button class="btn-pass px-4 py-2 rounded-xl bg-emerald-600 text-white" data-appid="' + escapeHtml(app.applicationId) + '">通过</button>'
          + '<button class="btn-reject px-4 py-2 rounded-xl bg-rose-600 text-white" data-appid="' + escapeHtml(app.applicationId) + '">拒绝</button>'
          + '</div>'
          + '</div>'
          + '</div>';
      }).join('');

      dom.auditList.querySelectorAll('.btn-pass').forEach((btn) => {
        btn.addEventListener('click', () => auditApplication(btn.getAttribute('data-appid'), 1));
      });
      dom.auditList.querySelectorAll('.btn-reject').forEach((btn) => {
        btn.addEventListener('click', () => auditApplication(btn.getAttribute('data-appid'), 2));
      });

      recalcPendingCount();
      renderJobList();
    }

    // 已实现后端接口连接
    // 接口: POST /application?action=audit
    async function auditApplication(applicationId, auditStatus) {
      const card = document.getElementById('app-' + applicationId);
      const buttons = card ? card.querySelectorAll('button') : [];
      buttons.forEach((b) => {
        b.disabled = true;
        b.style.opacity = '0.5';
      });

      const params = new URLSearchParams();
      params.append('applicationId', applicationId);
      params.append('auditStatus', auditStatus);
      params.append('remark', auditStatus === 1 ? '通过' : '拒绝');

      const r = await request('/application?action=audit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
      setDebug(r.data || r.raw || r.error);

      if (r.ok && r.data) {
        alert(r.data.msg || '审核完成');
      } else {
        alert('审核失败');
      }

      if (r.ok && r.data && r.data.code === 200) {
        await loadApplicants(dom.auditJobSelector.value);
      } else {
        buttons.forEach((b) => {
          b.disabled = false;
          b.style.opacity = '1';
        });
      }
    }

    async function preloadPendingCount() {
      const map = {};
      for (let i = 0; i < state.jobs.length; i += 1) {
        const job = state.jobs[i];
        const r = await request('/application?action=listByJob&jobId=' + encodeURIComponent(job.jobId));
        if (r.ok && r.data && r.data.code === 200) {
          const pending = (r.data.data || []).filter((x) => getApplyStatus(x) == 0).length;
          map[job.jobId] = pending;
        } else {
          map[job.jobId] = 0;
        }
      }
      state.pendingMap = map;
      recalcPendingCount();
      renderJobList();
    }

    function recalcPendingCount() {
      const sum = Object.values(state.pendingMap).reduce((a, b) => a + Number(b || 0), 0);
      dom.countPending.textContent = String(sum);
    }

    function bindEvents() {
      dom.btnLogout.addEventListener('click', logout);
      dom.btnRefresh.addEventListener('click', loadMyJobs);
      dom.btnOpenPublish.addEventListener('click', () => showModal(dom.publishModal));
      dom.btnOpenAudit.addEventListener('click', async () => {
        showModal(dom.auditModal);
        state.selectedJobIdForAudit = dom.auditJobSelector.value;
        if (state.selectedJobIdForAudit) {
          await loadApplicants(state.selectedJobIdForAudit);
        }
      });
      dom.btnSubmitPublish.addEventListener('click', publishJob);

      dom.searchInput.addEventListener('input', () => {
        applyFilter();
        renderJobList();
      });

      dom.auditJobSelector.addEventListener('change', () => {
        state.selectedJobIdForAudit = dom.auditJobSelector.value;
      });

      dom.btnLoadApplicants.addEventListener('click', async () => {
        state.selectedJobIdForAudit = dom.auditJobSelector.value;
        if (!state.selectedJobIdForAudit) {
          alert('请先选择岗位');
          return;
        }
        await loadApplicants(state.selectedJobIdForAudit);
      });

      // 未实现后端接口，保留前端展示
      // 示例接口未覆盖个人资料编辑/简历上传，本按钮仅提示
      dom.btnEditProfile.addEventListener('click', () => {
        alert('未实现后端接口，保留前端展示：个人资料编辑将在后续对接。');
      });

      bindCloseModal();
    }

    async function bootstrap() {
      const pass = await loadLoginUser();
      if (!pass) return;
      bindEvents();
      await loadMyJobs();
    }

    bootstrap();
  </script>
</body>
</html>
