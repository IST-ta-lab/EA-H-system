<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO 工作台 - 助教招聘系统</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: rgba(255, 255, 255, 0.8);
            --text: #0f172a;
            --subtext: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #0ea5e9;
            --danger: #e11d48;
            --warning: #d97706;
            --success: #059669;
            --border: #e2e8f0;
            --ring: 0 0 0 4px rgba(79, 70, 229, 0.1);
            --shadow-card: 0 8px 30px rgba(15, 23, 42, 0.06);
            --shadow-float: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            position: relative;
        }

        .page-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 999px;
            filter: blur(90px);
            opacity: 0.42;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 420px;
            height: 420px;
            background: #c7d2fe;
            top: -120px;
            left: -120px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #fbcfe8;
            bottom: -100px;
            right: -50px;
            animation-delay: 1.5s;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            background: #bae6fd;
            top: 25%;
            right: 22%;
            animation-delay: 0.8s;
        }

        .grid-mask {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(15, 23, 42, 0.07) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: linear-gradient(to bottom, white 0%, transparent 82%);
            -webkit-mask-image: linear-gradient(to bottom, white 0%, transparent 82%);
            opacity: 0.55;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 25;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.64);
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(140deg, #4f46e5, #7c3aed);
            color: #fff;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.34);
            transform: rotate(-6deg);
        }

        .brand-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .brand-sub {
            color: #64748b;
            font-size: 12px;
            margin-top: 2px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-field {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        .toolbar input {
            width: 130px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            padding: 8px 10px;
            outline: none;
        }

        .toolbar input:focus {
            border-color: rgba(79, 70, 229, 0.6);
            box-shadow: var(--ring);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px 30px;
            position: relative;
            z-index: 1;
        }

        .hero {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 18px;
            flex-wrap: wrap;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(30px, 4vw, 54px);
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .hero h1 .dot {
            color: #4f46e5;
        }

        .hero p {
            margin: 10px 0 0;
            color: var(--subtext);
            max-width: 700px;
            line-height: 1.6;
        }

        .user-pill {
            border-radius: 18px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: var(--shadow-card);
            min-width: 260px;
        }

        .user-pill .label {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            border-radius: 26px;
            border: 1px solid rgba(226, 232, 240, 0.95);
            background: var(--panel);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .panel-title {
            margin: 0;
            padding: 20px 22px 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .panel-body {
            padding: 10px 22px 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-item.full {
            grid-column: 1 / -1;
        }

        .form-item label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            background: rgba(248, 250, 252, 0.85);
            transition: all 0.18s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(79, 70, 229, 0.7);
            box-shadow: var(--ring);
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 108px;
            line-height: 1.5;
        }

        .btn {
            border: none;
            border-radius: 14px;
            cursor: pointer;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
        }

        .btn-ghost {
            background: #eef2ff;
            color: #3730a3;
        }

        .btn-danger {
            background: #f43f5e;
            color: #fff;
        }

        .btn-success {
            background: #10b981;
            color: #fff;
        }

        .btn-warning {
            background: #f59e0b;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .job-card,
        .app-card {
            border-radius: 22px;
            border: 1px solid #eef2ff;
            background: rgba(255, 255, 255, 0.94);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .job-card:hover,
        .app-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.09);
        }

        .job-title {
            font-size: 22px;
            margin: 0 0 8px;
            letter-spacing: -0.01em;
        }

        .desc {
            color: #334155;
            margin: 10px 0 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .meta-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .chip-open { background: #ecfeff; border-color: #a5f3fc; color: #0c4a6e; }
        .chip-closed { background: #fef3c7; border-color: #fde68a; color: #92400e; }
        .chip-filled { background: #ffe4e6; border-color: #fecdd3; color: #9f1239; }

        .chip-pending { background: #fef3c7; border-color: #fde68a; color: #92400e; }
        .chip-pass { background: #dcfce7; border-color: #bbf7d0; color: #065f46; }
        .chip-reject { background: #ffe4e6; border-color: #fecdd3; color: #9f1239; }

        .muted {
            color: var(--subtext);
            font-size: 13px;
            line-height: 1.5;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .row-end {
            justify-content: flex-end;
        }

        .empty {
            color: var(--subtext);
            padding: 22px 0;
            font-weight: 500;
        }

        .response {
            white-space: pre-wrap;
            background: #0f172a;
            color: #dbeafe;
            border-radius: 20px;
            padding: 16px;
            height: 240px;
            overflow: auto;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.28);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .modal {
            width: min(760px, 96vw);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: var(--shadow-float);
            max-height: 86vh;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .modal-head {
            padding: 20px 22px;
            border-bottom: 1px solid #eef2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px 22px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 10px 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .detail-grid b {
            color: #334155;
        }

        @media (max-width: 1040px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .container {
                padding: 18px 14px 24px;
            }

            .nav-inner {
                padding: 12px 14px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                border-radius: 22px;
            }

            .panel-title {
                font-size: 18px;
            }

            .job-title {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
<div class="page-decor">
    <div class="grid-mask"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<nav class="top-nav">
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-icon">MO</div>
            <div>
                <div class="brand-title">TA Market</div>
                <div class="brand-sub">Module Organizer Workspace</div>
            </div>
        </div>
        <div class="toolbar">
            <div class="toolbar-field">
                <label for="baseUrlInput">BASE_URL</label>
                <input id="baseUrlInput" value="/tapj" placeholder="/tapj">
            </div>
            <button class="btn btn-ghost" id="baseUrlBtn">更新</button>
            <button class="btn btn-danger" id="logoutBtn">退出登录</button>
        </div>
    </div>
</nav>

<div class="container">
    <section class="hero">
        <div>
            <h1>Manage TA Roles<span class="dot">.</span></h1>
            <p>在这里完成 MO 核心工作流：发布岗位、查看详情、审核申请，并实时同步后端状态。</p>
        </div>
        <div class="user-pill">
            <div class="label">Current Organizer</div>
            <div id="userInfo">正在读取登录信息...</div>
        </div>
    </section>

    <div class="grid">
        <section class="panel">
            <h2 class="panel-title">发布新岗位</h2>
            <div class="panel-body">
                <div class="form-grid">
                    <div class="form-item">
                        <label for="jobName">岗位名称</label>
                        <input id="jobName" type="text" placeholder="例如：软件工程课程助教">
                    </div>
                    <div class="form-item">
                        <label for="jobType">岗位类型</label>
                        <select id="jobType">
                            <option value="1">课程助教</option>
                            <option value="2">监考助教</option>
                            <option value="3">活动助教</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label for="belongModule">所属模块</label>
                        <input id="belongModule" type="text" placeholder="例如：软件工程基础理论">
                    </div>
                    <div class="form-item">
                        <label for="workHoursWeekly">每周工作时长（小时）</label>
                        <input id="workHoursWeekly" type="number" min="1" step="0.5" placeholder="10">
                    </div>
                    <div class="form-item">
                        <label for="recruitNum">招聘人数</label>
                        <input id="recruitNum" type="number" min="1" step="1" placeholder="2">
                    </div>
                    <div class="form-item">
                        <label for="applyDeadline">申请截止日期</label>
                        <input id="applyDeadline" type="date">
                    </div>
                    <div class="form-item full">
                        <label for="jobDesc">岗位描述</label>
                        <textarea id="jobDesc" placeholder="请描述岗位职责、任职要求、沟通方式等"></textarea>
                    </div>
                </div>
                <div class="actions" style="margin-top: 12px;">
                    <button class="btn btn-primary" id="publishBtn">发布岗位</button>
                    <button class="btn btn-ghost" id="clearFormBtn">清空表单</button>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">岗位申请审核</h2>
            <div class="panel-body">
                <div class="row">
                    <input id="queryJobId" type="text" placeholder="输入岗位ID查看申请" style="flex: 1; min-width: 220px;">
                    <button class="btn btn-primary" id="queryAppBtn">加载申请</button>
                </div>
                <div class="muted" style="margin: 8px 0 12px;" id="appSummary">请选择岗位查看申请。</div>
                <div id="jobApplicationList"></div>
            </div>
        </section>
    </div>

    <section class="panel" style="margin-top: 20px;">
        <h2 class="panel-title">我发布的岗位</h2>
        <div class="panel-body">
            <div class="row row-end" style="margin-bottom: 12px;">
                <button class="btn btn-primary" id="refreshJobsBtn">刷新列表</button>
            </div>
            <div id="myJobList"></div>
        </div>
    </section>

    <section class="panel" style="margin-top: 20px;">
        <h2 class="panel-title">服务器响应</h2>
        <div class="panel-body">
            <pre class="response" id="response">等待操作...</pre>
        </div>
    </section>
</div>

<div class="modal-mask" id="jobDetailModal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="modalJobName" style="margin: 0;">岗位详情</h3>
            <button class="btn btn-ghost" id="closeModalBtn">关闭</button>
        </div>
        <div class="modal-body" id="jobDetailContent"></div>
    </div>
</div>

<script>
    let BASE_URL = '/tapj';
    let currentUser = null;
    let activeJobIdForAudit = '';

    const el = {
        userInfo: document.getElementById('userInfo'),
        response: document.getElementById('response'),
        baseUrlInput: document.getElementById('baseUrlInput'),
        baseUrlBtn: document.getElementById('baseUrlBtn'),
        logoutBtn: document.getElementById('logoutBtn'),
        publishBtn: document.getElementById('publishBtn'),
        clearFormBtn: document.getElementById('clearFormBtn'),
        refreshJobsBtn: document.getElementById('refreshJobsBtn'),
        myJobList: document.getElementById('myJobList'),
        queryJobId: document.getElementById('queryJobId'),
        queryAppBtn: document.getElementById('queryAppBtn'),
        appSummary: document.getElementById('appSummary'),
        jobApplicationList: document.getElementById('jobApplicationList'),
        jobDetailModal: document.getElementById('jobDetailModal'),
        modalJobName: document.getElementById('modalJobName'),
        jobDetailContent: document.getElementById('jobDetailContent'),
        closeModalBtn: document.getElementById('closeModalBtn'),
        jobName: document.getElementById('jobName'),
        jobType: document.getElementById('jobType'),
        belongModule: document.getElementById('belongModule'),
        jobDesc: document.getElementById('jobDesc'),
        workHoursWeekly: document.getElementById('workHoursWeekly'),
        recruitNum: document.getElementById('recruitNum'),
        applyDeadline: document.getElementById('applyDeadline')
    };

    function showResponse(data) {
        el.response.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function jobTypeText(type) {
        if (type === 1) return '课程助教';
        if (type === 2) return '监考助教';
        if (type === 3) return '活动助教';
        return '未知';
    }

    function jobStatusChip(status) {
        if (status === 0) return '<span class="chip chip-open">招聘中</span>';
        if (status === 1) return '<span class="chip chip-closed">已截止</span>';
        if (status === 2) return '<span class="chip chip-filled">已招满</span>';
        return '<span class="chip">未知状态</span>';
    }

    function applyStatusText(status) {
        if (status === 0) return { text: '待审核', cls: 'chip-pending' };
        if (status === 1) return { text: '已通过', cls: 'chip-pass' };
        if (status === 2) return { text: '已拒绝', cls: 'chip-reject' };
        return { text: '未知', cls: '' };
    }

    async function request(url, options) {
        const reqOptions = options || {};
        try {
            const res = await fetch(BASE_URL + url, {
                credentials: 'include',
                ...reqOptions
            });
            const text = await res.text();
            try {
                return { ok: true, data: JSON.parse(text) };
            } catch (e) {
                return { ok: false, raw: text };
            }
        } catch (e) {
            return { ok: false, error: e.message };
        }
    }

    // 已实现后端接口连接：获取当前登录用户 /user?action=getLoginUser
    async function loadLoginUser() {
        const r = await request('/user?action=getLoginUser');
        if (!r.ok || !r.data || r.data.code !== 200) {
            alert('未登录或会话过期，请先登录。');
            location.href = 'index.html';
            return;
        }

        currentUser = r.data.data;
        if (!currentUser || currentUser.userType !== 2) {
            alert('当前账号不是 MO，无权限进入 MO 工作台。');
            location.href = 'main.html';
            return;
        }

        el.userInfo.textContent = '当前用户：' + (currentUser.realName || '-') + '（' + (currentUser.username || '-') + '）';
        showResponse(r.data);
        await loadMyJobs();
    }

    function validatePublishForm() {
        const payload = {
            jobName: el.jobName.value.trim(),
            jobType: el.jobType.value,
            belongModule: el.belongModule.value.trim(),
            jobDesc: el.jobDesc.value.trim(),
            workHoursWeekly: el.workHoursWeekly.value.trim(),
            recruitNum: el.recruitNum.value.trim(),
            applyDeadline: el.applyDeadline.value.trim()
        };

        if (!payload.jobName || !payload.belongModule || !payload.jobDesc || !payload.workHoursWeekly || !payload.recruitNum || !payload.applyDeadline) {
            return { ok: false, msg: '请完整填写岗位发布信息。' };
        }

        if (Number(payload.workHoursWeekly) <= 0) {
            return { ok: false, msg: '每周工作时长必须大于 0。' };
        }

        if (!Number.isInteger(Number(payload.recruitNum)) || Number(payload.recruitNum) <= 0) {
            return { ok: false, msg: '招聘人数必须是大于 0 的整数。' };
        }

        if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.applyDeadline)) {
            return { ok: false, msg: '截止日期格式必须为 YYYY-MM-DD。' };
        }

        return { ok: true, payload: payload };
    }

    // 已实现后端接口连接：MO发布岗位 /job?action=publish
    async function publishJob() {
        const check = validatePublishForm();
        if (!check.ok) {
            alert(check.msg);
            return;
        }

        const p = new URLSearchParams();
        p.append('jobName', check.payload.jobName);
        p.append('jobType', check.payload.jobType);
        p.append('belongModule', check.payload.belongModule);
        p.append('jobDesc', check.payload.jobDesc);
        p.append('workHoursWeekly', check.payload.workHoursWeekly);
        p.append('recruitNum', check.payload.recruitNum);
        p.append('applyDeadline', check.payload.applyDeadline);

        el.publishBtn.disabled = true;
        const r = await request('/job?action=publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: p
        });
        el.publishBtn.disabled = false;

        if (!r.ok) {
            showResponse(r.error || r.raw || '请求失败');
            alert('发布失败，请检查网络或后端服务。');
            return;
        }

        showResponse(r.data);
        alert(r.data.msg || '已提交');
        if (r.data.code === 200) {
            clearPublishForm();
            await loadMyJobs();
        }
    }

    function clearPublishForm() {
        el.jobName.value = '';
        el.jobType.value = '1';
        el.belongModule.value = '';
        el.jobDesc.value = '';
        el.workHoursWeekly.value = '';
        el.recruitNum.value = '';
        el.applyDeadline.value = '';
    }

    // 已实现后端接口连接：MO查询自己发布岗位 /job?action=listMy
    async function loadMyJobs() {
        const r = await request('/job?action=listMy');
        if (!r.ok || !r.data) {
            el.myJobList.innerHTML = '<div class="empty">加载失败，请检查服务。</div>';
            showResponse(r.error || r.raw || '加载失败');
            return;
        }

        showResponse(r.data);
        if (r.data.code !== 200) {
            el.myJobList.innerHTML = '<div class="empty">' + escapeHtml(r.data.msg || '加载失败') + '</div>';
            return;
        }

        const jobs = Array.isArray(r.data.data) ? r.data.data : [];
        if (jobs.length === 0) {
            el.myJobList.innerHTML = '<div class="empty">你还没有发布岗位。</div>';
            return;
        }

        let html = '';
        for (const job of jobs) {
            html +=
                '<div class="job-card">' +
                    '<h4 class="job-title">' + escapeHtml(job.jobName) + '</h4>' +
                    '<div class="meta-list">' +
                        '<span class="chip">岗位ID: ' + escapeHtml(job.jobId) + '</span>' +
                        '<span class="chip">类型: ' + escapeHtml(jobTypeText(job.jobType)) + '</span>' +
                        '<span class="chip">模块: ' + escapeHtml(job.belongModule || '-') + '</span>' +
                        '<span class="chip">工时: ' + escapeHtml(job.workHoursWeekly) + 'h/周</span>' +
                        '<span class="chip">招聘: ' + escapeHtml(job.hiredNum) + '/' + escapeHtml(job.recruitNum) + '</span>' +
                        jobStatusChip(job.jobStatus) +
                    '</div>' +
                    '<div class="muted">发布时间: ' + escapeHtml(job.publishTime || '-') + ' | 截止日期: ' + escapeHtml(job.applyDeadline || '-') + '</div>' +
                    '<div class="desc">' + escapeHtml(job.jobDesc || '暂无描述') + '</div>' +
                    '<div class="actions">' +
                        '<button class="btn btn-ghost" onclick="viewJobDetail(\'' + escapeHtml(job.jobId) + '\')">查看详情</button>' +
                        '<button class="btn btn-primary" onclick="loadJobApplications(\'' + escapeHtml(job.jobId) + '\')">查看申请</button>' +
                    '</div>' +
                '</div>';
        }

        el.myJobList.innerHTML = html;
    }

    // 已实现后端接口连接：岗位详情 /job?action=getDetail&jobId=...
    async function viewJobDetail(jobId) {
        const r = await request('/job?action=getDetail&jobId=' + encodeURIComponent(jobId));
        if (!r.ok || !r.data || r.data.code !== 200) {
            alert('加载岗位详情失败。');
            showResponse(r.error || r.raw || r.data || '加载失败');
            return;
        }

        const job = r.data.data;
        el.modalJobName.textContent = job.jobName || '岗位详情';
        el.jobDetailContent.innerHTML =
            '<div class="detail-grid">' +
                '<b>岗位ID</b><span>' + escapeHtml(job.jobId) + '</span>' +
                '<b>岗位类型</b><span>' + escapeHtml(jobTypeText(job.jobType)) + '</span>' +
                '<b>所属模块</b><span>' + escapeHtml(job.belongModule || '-') + '</span>' +
                '<b>工作时长</b><span>' + escapeHtml(job.workHoursWeekly) + ' 小时/周</span>' +
                '<b>招聘人数</b><span>' + escapeHtml(job.hiredNum) + ' / ' + escapeHtml(job.recruitNum) + '</span>' +
                '<b>岗位状态</b><span>' + jobStatusChip(job.jobStatus) + '</span>' +
                '<b>截止日期</b><span>' + escapeHtml(job.applyDeadline || '-') + '</span>' +
                '<b>发布时间</b><span>' + escapeHtml(job.publishTime || '-') + '</span>' +
                '<b>岗位描述</b><span style="white-space: pre-wrap;">' + escapeHtml(job.jobDesc || '暂无描述') + '</span>' +
            '</div>';
        el.jobDetailModal.style.display = 'flex';
        showResponse(r.data);
    }

    function closeJobDetail() {
        el.jobDetailModal.style.display = 'none';
    }

    // 已实现后端接口连接：MO查看岗位申请 /application?action=listByJob&jobId=...
    async function loadJobApplications(jobId) {
        const id = (jobId || el.queryJobId.value).trim();
        if (!id) {
            alert('请先输入岗位ID。');
            return;
        }

        activeJobIdForAudit = id;
        el.queryJobId.value = id;

        const r = await request('/application?action=listByJob&jobId=' + encodeURIComponent(id));
        if (!r.ok || !r.data) {
            el.jobApplicationList.innerHTML = '<div class="empty">加载申请失败。</div>';
            showResponse(r.error || r.raw || '加载失败');
            return;
        }

        showResponse(r.data);
        if (r.data.code !== 200) {
            el.jobApplicationList.innerHTML = '<div class="empty">' + escapeHtml(r.data.msg || '无权限或查询失败') + '</div>';
            el.appSummary.textContent = '申请加载失败';
            return;
        }

        const apps = Array.isArray(r.data.data) ? r.data.data : [];
        const pending = apps.filter(function(app) { return app.applyStatus === 0; }).length;
        const passed = apps.filter(function(app) { return app.applyStatus === 1; }).length;
        const rejected = apps.filter(function(app) { return app.applyStatus === 2; }).length;
        el.appSummary.textContent = '岗位 ' + id + '：共 ' + apps.length + ' 条申请（待审核 ' + pending + '，通过 ' + passed + '，拒绝 ' + rejected + '）';

        if (apps.length === 0) {
            el.jobApplicationList.innerHTML = '<div class="empty">该岗位暂无申请记录。</div>';
            return;
        }

        let html = '';
        for (const app of apps) {
            const status = applyStatusText(app.applyStatus);
            html +=
                '<div class="app-card" id="app-' + escapeHtml(app.applicationId) + '">' +
                    '<div class="meta-list">' +
                        '<span class="chip">申请ID: ' + escapeHtml(app.applicationId) + '</span>' +
                        '<span class="chip">TA用户ID: ' + escapeHtml(app.taUserId || '-') + '</span>' +
                        '<span class="chip">姓名: ' + escapeHtml(app.taRealName || '-') + '</span>' +
                        '<span class="chip">学号: ' + escapeHtml(app.taStudentId || '-') + '</span>' +
                        '<span class="chip">专业: ' + escapeHtml(app.taMajor || '-') + '</span>' +
                        '<span class="chip ' + status.cls + '">状态: ' + escapeHtml(status.text) + '</span>' +
                    '</div>' +
                    '<div class="muted">邮箱: ' + escapeHtml(app.taEmail || '-') + ' | 学历: ' + escapeHtml(app.taEducation || '-') + '</div>' +
                    '<div class="muted">申请时间: ' + escapeHtml(app.applyTime || '-') + ' | 备注: ' + escapeHtml(app.auditRemark || '-') + '</div>';

            if (app.applyStatus === 0) {
                html +=
                    '<div class="actions" style="margin-top: 10px;">' +
                        '<button class="btn btn-success" onclick="auditApplication(\'' + escapeHtml(app.applicationId) + '\', 1)">通过</button>' +
                        '<button class="btn btn-warning" onclick="auditApplication(\'' + escapeHtml(app.applicationId) + '\', 2)">拒绝</button>' +
                    '</div>';
            }

            html += '</div>';
        }

        el.jobApplicationList.innerHTML = html;
    }

    // 已实现后端接口连接：MO审核申请 /application?action=audit
    async function auditApplication(applicationId, auditStatus) {
        const appCard = document.getElementById('app-' + applicationId);
        const buttons = appCard ? appCard.querySelectorAll('button') : [];
        buttons.forEach(function(btn) { btn.disabled = true; });

        const p = new URLSearchParams();
        p.append('applicationId', applicationId);
        p.append('auditStatus', String(auditStatus));
        p.append('remark', auditStatus === 1 ? '通过' : '拒绝');

        const r = await request('/application?action=audit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: p
        });

        if (!r.ok || !r.data) {
            showResponse(r.error || r.raw || '审核请求失败');
            alert('审核失败，请稍后重试。');
            buttons.forEach(function(btn) { btn.disabled = false; });
            return;
        }

        showResponse(r.data);
        alert(r.data.msg || '审核完成');
        if (r.data.code === 200) {
            await loadJobApplications(activeJobIdForAudit);
            await loadMyJobs();
            return;
        }

        buttons.forEach(function(btn) { btn.disabled = false; });
    }

    // 已实现后端接口连接：退出登录 /user?action=logout
    async function logout() {
        await request('/user?action=logout', { method: 'POST' });
        location.href = 'index.html';
    }

    function bindEvents() {
        el.baseUrlBtn.addEventListener('click', function() {
            const v = el.baseUrlInput.value.trim();
            if (!v) {
                alert('BASE_URL 不能为空。');
                return;
            }
            BASE_URL = v;
            showResponse({ code: 200, msg: 'BASE_URL 已更新', data: BASE_URL });
        });

        el.logoutBtn.addEventListener('click', logout);
        el.publishBtn.addEventListener('click', publishJob);
        el.clearFormBtn.addEventListener('click', clearPublishForm);
        el.refreshJobsBtn.addEventListener('click', loadMyJobs);
        el.queryAppBtn.addEventListener('click', function() { loadJobApplications(); });
        el.closeModalBtn.addEventListener('click', closeJobDetail);
        el.jobDetailModal.addEventListener('click', function(e) {
            if (e.target === el.jobDetailModal) {
                closeJobDetail();
            }
        });
    }

    window.onload = async function() {
        bindEvents();
        await loadLoginUser();
    };

    window.viewJobDetail = viewJobDetail;
    window.loadJobApplications = loadJobApplications;
    window.auditApplication = auditApplication;
</script>
</body>
</html>
