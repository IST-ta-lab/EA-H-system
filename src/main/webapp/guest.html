<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TA Market</title>
    <link rel="stylesheet" href="ta.css" />
    <link rel="stylesheet" href="guest.css" />
</head>
<body>
<div class="page-shell">
    <div class="bg-layer">
        <div class="bg-grid"></div>
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
    </div>

    <header class="top-nav">
        <div class="container nav-inner">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6.5 12 3l8 3.5-8 3.5L4 6.5Zm2 3.1V15c0 1.2 2.7 3 6 3s6-1.8 6-3V9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand-name">TA Market</span>
            </div>

            <div class="nav-right">
                <span class="nav-username" id="navUserName"></span>
                <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
                <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Open profile">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container main-layout">
        <section class="main-content" id="mainContent">
            <div id="feedView" class="view-panel active"></div>
            <div id="profileView" class="view-panel"></div>
        </section>

        <aside class="sidebar" id="sidebar"></aside>
    </main>
</div>

<!-- Edit profile modal -->
<div class="modal-overlay hidden" id="profileModalOverlay">
    <div class="modal-card modal-large scale-enter" id="profileModalCard">
        <div class="modal-header">
            <h2>Edit Profile</h2>
            <button class="icon-btn" id="closeProfileModalBtn" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="modal-body form-layout scrollable">
            <div class="form-group">
                <label for="profileNameInput">Name</label>
                <input id="profileNameInput" type="text" />
            </div>

            <div class="form-group">
                <label for="profileEmailInput">Email</label>
                <input id="profileEmailInput" type="email" />
            </div>

            <div class="form-group">
                <label for="profileMajorInput">Major / Department</label>
                <input id="profileMajorInput" type="text" />
            </div>

            <div class="form-group">
                <label for="profileBioInput">Bio</label>
                <textarea id="profileBioInput" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Tags</label>
                <div class="tag-list" id="profileTagList"></div>
            </div>

            <button class="check-row" id="profileVisibleToggle" type="button">
                <span class="check-icon" id="profileVisibleIcon"></span>
                <span>
            <strong>Visible to others</strong>
            <small>Allow course leads to find your profile</small>
          </span>
            </button>
        </div>

        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelProfileModalBtn" type="button">Cancel</button>
            <button class="btn btn-primary" id="saveProfileBtn" type="button">Save Changes</button>
        </div>
    </div>
</div>

<!-- Role details / Application modal -->
<div class="modal-overlay hidden" id="jobModalOverlay">
    <div class="modal-card modal-xl scale-enter" id="jobModalCard">
        <div class="modal-header job-header">
            <div>
                <h2 id="jobModalTitle"></h2>
                <div class="job-meta-row" id="jobModalMeta"></div>
            </div>
            <button class="icon-btn" id="closeJobModalBtn" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="modal-body scrollable" id="jobModalBody">
            <section class="job-section">
                <h3>Role Description</h3>
                <p id="jobDescriptionText"></p>
            </section>

            <section class="match-card" id="matchCard"></section>

            <section class="job-section">
                <h3>Required Skills</h3>
                <div class="tag-list" id="jobRequiredTags"></div>
            </section>

            <hr class="divider" />

            <section class="job-section">
                <h3>Submit Application</h3>

                <div class="option-list">
                    <button class="check-row" id="takenCourseToggle" type="button">
                        <span class="check-icon" id="takenCourseIcon"></span>
                        <span><strong>I have taken this course before</strong></span>
                    </button>

                    <button class="check-row" id="inPersonToggle" type="button">
                        <span class="check-icon" id="inPersonIcon"></span>
                        <span><strong>I can attend in-person sessions</strong></span>
                    </button>
                </div>

                <div class="form-group">
                    <label for="appRemarksInput">Additional Notes (optional)</label>
                    <textarea id="appRemarksInput" rows="3" placeholder="Add relevant experience or why you're a good fit..."></textarea>
                </div>
            </section>
        </div>

        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelJobModalBtn" type="button">Cancel</button>
            <button class="btn btn-primary" id="submitApplicationBtn" type="button">Submit Application</button>
        </div>
    </div>
</div>


<!-- Guest prompt modal -->
<div class="modal-overlay hidden" id="guestModalOverlay">
    <div class="modal-card scale-enter guest-modal-card">
        <div class="modal-header">
            <h2>提示</h2>
        </div>
        <div class="modal-body">
            <p class="guest-modal-desc">您未注册，请先登录/注册</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="guestGoLoginBtn" type="button">Go to Register/Login Page</button>
        </div>
    </div>
</div>
    <script src="guest.js"></script>
</body>
</html>
