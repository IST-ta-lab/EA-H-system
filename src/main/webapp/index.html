<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助教招聘系统 - 登录/注册</title>
    <style>
        /* 原有所有样式完全保留，只在登录按钮区域加一个游客按钮的样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #4facfe;
            --accent-color: #764ba2;
            --light-bg: #f5f7fa;
            --white: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --moveX: 0px;
            --moveY: 0px;
            --spotlightX: 50%;
            --spotlightY: 50%;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #c3dafe 100%);
            position: relative;
            overflow-x: hidden;
            &::after {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle 600px at var(--spotlightX) var(--spotlightY), rgba(102, 126, 234, 0.08) 0%, transparent 60%);
                pointer-events: none;
                z-index: 0;
                transition: all 0.1s ease-out;
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                    linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            top: -100px;
            right: -100px;
            animation: float1 20s ease-in-out infinite;
            transform: translate(calc(var(--moveX) * 0.02), calc(var(--moveY) * 0.02));
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            bottom: -50px;
            left: -50px;
            animation: float2 25s ease-in-out infinite;
            transform: translate(calc(var(--moveX) * -0.02), calc(var(--moveY) * -0.02));
        }

        @keyframes float1 {
            0%, 100% { transform: translate(calc(var(--moveX) * 0.02), calc(var(--moveY) * 0.02)) scale(1); }
            33% { transform: translate(calc(var(--moveX) * 0.02 + 30px), calc(var(--moveY) * 0.02 - 30px)) scale(1.05); }
            66% { transform: translate(calc(var(--moveX) * 0.02 - 20px), calc(var(--moveY) * 0.02 + 20px)) scale(0.95); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(calc(var(--moveX) * -0.02), calc(var(--moveY) * -0.02)) scale(1); }
            33% { transform: translate(calc(var(--moveX) * -0.02 - 30px), calc(var(--moveY) * -0.02 + 20px)) scale(1.05); }
            66% { transform: translate(calc(var(--moveX) * -0.02 + 20px), calc(var(--moveY) * -0.02 - 20px)) scale(0.95); }
        }

        .typing-text {
            overflow: hidden;
            border-right: 3px solid var(--white);
            white-space: nowrap;
            animation: typing 3s steps(12, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--white); }
        }

        .top-bar {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            animation: slideDown 0.8s ease-out;
            flex-shrink: 0;
            transform: translate(calc(var(--moveX) * 0.01), calc(var(--moveY) * 0.01));
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            animation: pulse 2s ease-in-out infinite;
            transition: transform 0.3s ease;
            transform: translate(calc(var(--moveX) * 0.03), calc(var(--moveY) * 0.03));
        }

        .logo-icon:hover {
            transform: translate(calc(var(--moveX) * 0.03), calc(var(--moveY) * 0.03)) scale(1.1) rotate(5deg);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3); }
            50% { box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5); }
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            letter-spacing: 2px;
        }

        .top-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
            width: 100%;
            perspective: 1000px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            max-height: 85vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow:
                    0 25px 50px -12px rgba(0, 0, 0, 0.15),
                    0 0 0 1px rgba(102, 126, 234, 0.1);
            overflow: hidden;
            display: flex;
            animation: fadeInUp 1s ease-out 0.2s both;
            transform-style: preserve-3d;
            transform: translate(calc(var(--moveX) * 0.015), calc(var(--moveY) * 0.015)) rotateY(calc(var(--moveX) * 0.005)) rotateX(calc(var(--moveY) * -0.005));
            transition: transform 0.1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .intro-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #4facfe 50%, #764ba2 100%);
            color: white;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transform: translate(calc(var(--moveX) * -0.02), calc(var(--moveY) * -0.02));
            animation: slideInLeft 1s ease-out 0.3s both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .intro-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .intro-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .intro-desc {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feature-list {
            list-style: none;
            position: relative;
            z-index: 1;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
            transition: all 0.3s ease;
            transform: translateX(0);
            animation: slideInUp 0.5s ease-out both;
        }

        .feature-item:nth-child(1) { animation-delay: 0.6s; }
        .feature-item:nth-child(2) { animation-delay: 0.7s; }
        .feature-item:nth-child(3) { animation-delay: 0.8s; }
        .feature-item:nth-child(4) { animation-delay: 0.9s; }

        .feature-item:hover {
            transform: translateX(10px);
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .feature-item:hover .feature-icon {
            transform: scale(1.2);
            background: rgba(255,255,255,0.3);
        }

        .form-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideInRight 1s ease-out 0.3s both;
            transform-style: preserve-3d;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .tab-container {
            display: flex;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 10px;
            padding: 5px;
            position: relative;
            flex-shrink: 0;
        }

        .tab-slider {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .tab-btn.active {
            color: #667eea;
        }

        .form-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f0f0f0;
        }

        .form-scroll-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .form-scroll-wrapper::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }
        .form-scroll-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #4facfe 100%);
            border-radius: 10px;
        }
        .form-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        .form-container {
            position: relative;
            min-height: 500px;
            width: 100%;
            transform-style: preserve-3d;
        }

        .form-box {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: rotateY(90deg) scale(0.9);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            padding-bottom: 20px;
            backface-visibility: hidden;
        }

        .form-box.active {
            opacity: 1;
            transform: rotateY(0deg) scale(1);
            pointer-events: auto;
        }

        .form-box.exit {
            opacity: 0;
            transform: rotateY(-90deg) scale(0.9);
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            font-weight: 500;
            color: #999;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--white);
            padding: 0 4px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
            position: relative;
        }

        .input-field:focus,
        .input-field:not(:placeholder-shown) {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-field:focus + .input-label,
        .input-field:not(:placeholder-shown) + .input-label {
            top: 0;
            left: 12px;
            font-size: 12px;
            color: #667eea;
        }

        .input-group::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: calc(100% - 20px);
            height: 2px;
            background: linear-gradient(90deg, #667eea 0%, #4facfe 50%, #764ba2 100%);
            border-radius: 2px;
            transition: transform 0.4s ease;
            transform-origin: center;
        }

        .input-field:focus ~ ::after {
            transform: translateX(-50%) scaleX(1);
        }

        .input-row {
            display: flex;
            gap: 15px;
        }

        .input-row .input-group {
            flex: 1;
        }

        /* ==================== 新增：登录按钮区域的样式调整 ==================== */
        .login-btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .submit-btn {
            flex: 1;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #4facfe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ==================== 新增：游客登录按钮的样式 ==================== */
        .guest-btn {
            flex: 1;
            padding: 16px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .guest-btn:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(79, 172, 254, 0.05) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .guest-btn:active {
            transform: translateY(0);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        .guest-btn .ripple {
            background: rgba(102, 126, 234, 0.1);
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .btn-loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .response-section {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 10px;
            border-left: 4px solid #667eea;
            flex-shrink: 0;
        }

        .response-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
        }

        pre {
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @media (max-width: 900px) {
            .top-bar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .container {
                flex-direction: column;
                width: 95%;
                max-height: none;
            }
            .intro-section {
                padding: 40px 30px;
            }
            .form-section {
                padding: 30px 20px;
                max-height: 70vh;
            }
            .input-row {
                flex-direction: column;
                gap: 0;
            }
            .form-container {
                min-height: auto;
            }
            .typing-text {
                white-space: normal;
                border-right: none;
                animation: none;
            }
            .login-btn-group {
                flex-direction: column;
            }
        }

        @media (max-height: 800px) {
            .container {
                max-height: 90vh;
            }
            .form-section {
                padding: 30px 50px;
            }
        }
    </style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<!-- 顶部栏 -->
<div class="top-bar">
    <div class="logo-section">
        <div class="logo-icon">🎓</div>
        <div>
            <div class="logo-text">TA Hiring System</div>
        </div>
    </div>
    <div style="text-align: right;">
        <div class="top-title">助教招聘系统</div>
        <div class="top-subtitle">Teaching Assistant Recruitment Platform</div>
    </div>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <div class="container">
        <!-- 左侧：项目介绍 -->
        <div class="intro-section">
            <h1 class="intro-title typing-text">高效招聘，精准匹配</h1>
            <p class="intro-desc">
                一个现代化的助教招聘管理平台，为教师和学生提供一站式的招聘与申请服务，让招聘流程更简单、更高效。
            </p>
            <ul class="feature-list">
                <li class="feature-item">
                    <span class="feature-icon">✓</span>
                    <span>TA 在线申请，实时查看状态</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">✓</span>
                    <span>MO 发布岗位，便捷审核申请</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">✓</span>
                    <span>Admin 统一管理用户和岗位</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">✓</span>
                    <span>游客模式，浏览岗位详情</span>
                </li>
            </ul>
        </div>

        <!-- 右侧：登录/注册表单 -->
        <div class="form-section">
            <!-- 切换按钮 -->
            <div class="tab-container">
                <div class="tab-slider" id="tabSlider"></div>
                <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">登录</button>
                <button class="tab-btn" data-tab="register" onclick="switchTab('register')">注册</button>
            </div>

            <!-- 滚动包装容器 -->
            <div class="form-scroll-wrapper">
                <div class="form-container">
                    <!-- 登录表单 -->
                    <div class="form-box active" id="loginForm">
                        <h2 class="form-title">欢迎回来 👋</h2>

                        <div class="input-group">
                            <input type="text" class="input-field" id="loginUsername" placeholder=" " value="admin">
                            <label class="input-label">用户名</label>
                        </div>

                        <div class="input-group">
                            <input type="password" class="input-field" id="loginPassword" placeholder=" " value="123456">
                            <label class="input-label">密码</label>
                        </div>

                        <!-- ==================== 核心修改：登录按钮区域加游客登录 ==================== -->
                        <div class="login-btn-group">
                            <button class="submit-btn" id="loginBtn" onclick="login(event)">立即登录</button>
                            <button class="guest-btn" id="guestBtn" onclick="guestLogin(event)">游客登录</button>
                        </div>
                    </div>

                    <!-- 注册表单 -->
                    <div class="form-box" id="registerForm">
                        <h2 class="form-title">创建账号 🚀</h2>

                        <div class="input-group">
                            <select class="input-field" id="registerRole" onchange="updateRegisterForm()">
                                <option value="ta">TA（助教申请者）</option>
                                <option value="mo">MO（教师/发布者）</option>
                            </select>
                            <label class="input-label">注册身份</label>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <input type="text" class="input-field" id="regUsername" placeholder=" ">
                                <label class="input-label">用户名</label>
                            </div>
                            <div class="input-group">
                                <input type="password" class="input-field" id="regPassword" placeholder=" ">
                                <label class="input-label">密码</label>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <input type="text" class="input-field" id="regRealName" placeholder=" ">
                                <label class="input-label">真实姓名</label>
                            </div>
                            <div class="input-group">
                                <input type="email" class="input-field" id="regEmail" placeholder=" ">
                                <label class="input-label">邮箱</label>
                            </div>
                        </div>

                        <!-- TA 专属字段 -->
                        <div id="taFields">
                            <div class="input-row">
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regStudentId" placeholder=" ">
                                    <label class="input-label">学号</label>
                                </div>
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regMajor" placeholder=" ">
                                    <label class="input-label">专业</label>
                                </div>
                            </div>
                            <div class="input-row">
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regEducation" placeholder=" ">
                                    <label class="input-label">学历</label>
                                </div>
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regGrade" placeholder=" ">
                                    <label class="input-label">年级</label>
                                </div>
                            </div>
                        </div>

                        <!-- MO 专属字段 -->
                        <div id="moFields" style="display: none;">
                            <div class="input-row">
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regStaffId" placeholder=" ">
                                    <label class="input-label">工号</label>
                                </div>
                                <div class="input-group">
                                    <input type="text" class="input-field" id="regDepartment" placeholder=" ">
                                    <label class="input-label">部门</label>
                                </div>
                            </div>
                        </div>

                        <button class="submit-btn" id="registerBtn" onclick="register(event)">立即注册</button>
                    </div>
                </div>
            </div>

            <!-- 响应显示区域 -->
            <div class="response-section" id="responseSection" style="display: none;">
                <div class="response-title">📡 服务器响应</div>
                <pre id="response"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = '/tapj';
    let isSubmitting = false;

    // 视差效果
    document.addEventListener('mousemove', (e) => {
        const x = e.clientX - window.innerWidth / 2;
        const y = e.clientY - window.innerHeight / 2;

        document.documentElement.style.setProperty('--moveX', `${x}px`);
        document.documentElement.style.setProperty('--moveY', `${y}px`);

        const spotlightX = (e.clientX / window.innerWidth) * 100;
        const spotlightY = (e.clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--spotlightX', `${spotlightX}%`);
        document.documentElement.style.setProperty('--spotlightY', `${spotlightY}%`);
    });

    // 按钮涟漪效果
    function createRipple(event) {
        const button = event.currentTarget;
        const ripple = document.createElement('span');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = event.clientX - rect.left - size / 2;
        const y = event.clientY - rect.top - size / 2;

        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');

        button.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 600);
    }

    document.querySelectorAll('.submit-btn, .tab-btn, .guest-btn').forEach(btn => {
        btn.addEventListener('click', createRipple);
    });

    // 切换登录/注册
    function switchTab(tab) {
        const tabs = document.querySelectorAll('.tab-btn');
        const forms = document.querySelectorAll('.form-box');
        const slider = document.getElementById('tabSlider');
        const activeTab = document.querySelector(`[data-tab="${tab}"]`);

        tabs.forEach(t => t.classList.remove('active'));
        activeTab.classList.add('active');

        if (tab === 'login') {
            slider.style.left = '5px';
        } else {
            slider.style.left = 'calc(50% + 2px)';
        }

        forms.forEach(f => f.classList.remove('active', 'exit'));
        const currentForm = document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm');
        const exitForm = document.getElementById(tab === 'login' ? 'registerForm' : 'loginForm');

        exitForm.classList.add('exit');
        setTimeout(() => {
            currentForm.classList.add('active');
            document.querySelector('.form-scroll-wrapper').scrollTop = 0;
        }, 300);
    }

    // 根据注册角色显示/隐藏字段
    function updateRegisterForm() {
        const role = document.getElementById('registerRole').value;
        document.getElementById('taFields').style.display = role === 'ta' ? 'block' : 'none';
        document.getElementById('moFields').style.display = role === 'mo' ? 'block' : 'none';
    }

    // 显示响应
    function showResponse(data) {
        const section = document.getElementById('responseSection');
        const pre = document.getElementById('response');
        section.style.display = 'block';
        pre.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    // 通用请求
    async function request(url, options = {}) {
        try {
            const res = await fetch(BASE_URL + url, {
                credentials: 'include',
                ...options
            });
            const text = await res.text();
            try {
                return { ok: true, data: JSON.parse(text) };
            } catch (e) {
                return { ok: false, raw: text };
            }
        } catch (e) {
            return { ok: false, error: e.message };
        }
    }

    // 登录
    async function login(event) {
        if (isSubmitting) return;
        createRipple(event);
        isSubmitting = true;

        const btn = document.getElementById('loginBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="btn-loader"></span> 登录中...';
        btn.disabled = true;

        const p = new URLSearchParams();
        p.append('username', document.getElementById('loginUsername').value);
        p.append('password', document.getElementById('loginPassword').value);

        const r = await request('/user?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: p
        });

        if(r.ok && r.data.code === 200) {
            const user = r.data.data;
            btn.innerHTML = '登录成功！正在跳转...';

            setTimeout(() => {
                if (user.userType === 1) {
                    location.href = "ta.html";
                } else if (user.userType === 2) {
                    location.href = "mo.html";
                } else if (user.userType === 3) {
                    location.href = "admin.html";
                }
            }, 800);
        } else {
            showResponse(r.data || r.raw);
            alert("登录失败：" + (r.data?.msg || "未知错误"));
            btn.innerHTML = originalText;
            btn.disabled = false;
            isSubmitting = false;
        }
    }

    // ==================== 核心新增：游客登录 ====================
    function guestLogin(event) {
        createRipple(event);
        // 直接跳转到 guest.html，不需要调用后端
        location.href = "guest.html";
    }

    // 注册
    async function register(event) {
        if (isSubmitting) return;
        createRipple(event);
        isSubmitting = true;

        const btn = document.getElementById('registerBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="btn-loader"></span> 注册中...';
        btn.disabled = true;

        const role = document.getElementById('registerRole').value;
        const p = new URLSearchParams();

        p.append('username', document.getElementById('regUsername').value);
        p.append('password', document.getElementById('regPassword').value);
        p.append('realName', document.getElementById('regRealName').value);
        p.append('email', document.getElementById('regEmail').value);

        let action = '';
        if (role === 'ta') {
            action = 'registerTA';
            p.append('studentId', document.getElementById('regStudentId').value);
            p.append('major', document.getElementById('regMajor').value);
            p.append('education', document.getElementById('regEducation').value);
            p.append('grade', document.getElementById('regGrade').value);
        } else {
            action = 'registerMO';
            p.append('staffId', document.getElementById('regStaffId').value);
            p.append('department', document.getElementById('regDepartment').value);
        }

        const r = await request(`/user?action=${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: p
        });

        showResponse(r.data || r.raw);

        if(r.ok && r.data.code === 200) {
            btn.innerHTML = '注册成功！';
            alert("注册成功！即将跳转到登录页");
            setTimeout(() => {
                switchTab('login');
                btn.innerHTML = originalText;
                btn.disabled = false;
                isSubmitting = false;
            }, 1000);
        } else {
            alert("注册失败：" + (r.data?.msg || "未知错误"));
            btn.innerHTML = originalText;
            btn.disabled = false;
            isSubmitting = false;
        }
    }

    window.addEventListener('load', () => {
        const title = document.querySelector('.typing-text');
        title.style.animation = 'none';
        setTimeout(() => {
            title.style.animation = 'typing 3s steps(12, end), blink-caret 0.75s step-end infinite';
        }, 100);
    });
</script>

</body>
</html>
